# =============================================================================
# Coraza WAF Configuration for Caddy
# =============================================================================
# This file contains the base Coraza WAF directives
# OWASP CRS rules are loaded separately from the shared storage
# =============================================================================

# -- Rule Engine Configuration --
SecRuleEngine DetectionOnly
# Change to "On" after testing to enable blocking mode
# SecRuleEngine On

# -- Request Body Handling --
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# -- Response Body Handling --
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# -- Filesystem Configuration --
SecTmpDir /tmp/
SecDataDir /var/lib/caddy/modsec_data/

# -- Audit Logging --
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/caddy/waf-audit.log

# -- Debug Logging (disable in production) --
SecDebugLogLevel 0

# -- Miscellaneous --
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127

# -- Rule ID Ranges --
# 1-99999: Internal rules and CRS
# 100000-199999: Custom rules
# 200000+: Application-specific rules

# =============================================================================
# Base Security Rules (before CRS)
# =============================================================================

# Block requests without Host header
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:1000,phase:1,deny,status:400,log,msg:'Missing Host Header'"

# Block requests with invalid Host header
SecRule REQUEST_HEADERS:Host "^$" \
    "id:1001,phase:1,deny,status:400,log,msg:'Empty Host Header'"

# Block HTTP/0.9 requests
SecRule REQUEST_PROTOCOL "!@within HTTP/1.0 HTTP/1.1 HTTP/2.0" \
    "id:1002,phase:1,deny,status:400,log,msg:'Invalid HTTP Protocol'"

# =============================================================================
# Rate Limiting Support Headers
# =============================================================================

# Add rate limit status to response headers
SecRule TX:RATE_LIMIT_EXCEEDED "@eq 1" \
    "id:1100,phase:3,pass,nolog,setenv:RATE_LIMITED=1"

# =============================================================================
# IP Reputation & Geo-blocking (customize as needed)
# =============================================================================

# Example: Block known bad IP ranges (uncomment and customize)
# SecRule REMOTE_ADDR "@ipMatch 192.0.2.0/24,198.51.100.0/24" \
#     "id:1200,phase:1,deny,status:403,log,msg:'Blocked IP range'"

# =============================================================================
# Custom Exclusions (add your exceptions here)
# =============================================================================

# Example: Exclude health check endpoint from WAF
SecRule REQUEST_URI "@beginsWith /health" \
    "id:1300,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Example: Exclude API webhooks from certain rules
# SecRule REQUEST_URI "@beginsWith /api/webhook" \
#     "id:1301,phase:1,pass,nolog,ctl:ruleRemoveById=941100-941999"

# =============================================================================
# Paranoia Level Configuration (for CRS)
# =============================================================================

# Set paranoia level (1-4, default is 1)
# Level 1: Minimal rules, lowest false positives
# Level 2: Additional rules for common attacks
# Level 3: More aggressive rules
# Level 4: Maximum protection, highest false positives
SecAction "id:900000,phase:1,pass,nolog,setvar:tx.paranoia_level=1"

# Set anomaly threshold scores
SecAction "id:900110,phase:1,pass,nolog,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Enable/disable specific attack categories
SecAction "id:900200,phase:1,pass,nolog,\
    setvar:tx.do_rep_block=1,\
    setvar:tx.do_rep_log=1"

# =============================================================================
# Sampling and Performance Tuning
# =============================================================================

# Skip WAF for static assets (performance optimization)
SecRule REQUEST_URI "@rx \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg)$" \
    "id:1400,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Skip WAF for large file uploads (handle separately)
SecRule REQUEST_HEADERS:Content-Length "@gt 10485760" \
    "id:1401,phase:1,pass,log,msg:'Large request body - reduced WAF inspection',\
    ctl:requestBodyAccess=Off"
